name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # No API key, deliberately. The agent loop runs against an injected
      # client, so the suite can never fail for a reason unrelated to the code.
      - run: npm test
